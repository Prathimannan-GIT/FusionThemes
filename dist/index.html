    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">

  <body class="bg-gray-50 text-gray-900 antialiased selection:bg-fusion-500 selection:text-white transition-colors duration-300 dark:bg-navy-950 dark:text-gray-100 min-h-screen flex flex-col">
    <div id="root"></div>
    <!-- Twemoji: renders emoji as colorful images on all browsers including Windows Chrome -->
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script>
      // Auto-parse emoji on every DOM update
      const observer = new MutationObserver(() => {
        twemoji.parse(document.body, {
          folder: 'svg',
          ext: '.svg',
          base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/'
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Initial parse
      document.addEventListener('DOMContentLoaded', () => {
        twemoji.parse(document.body, {
          folder: 'svg',
          ext: '.svg',
          base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/'
        });
      });
    </script>
  </body>
